# Rol: desarrollador. Escala: pro (máximo contexto para proyectos grandes y sesiones largas).
id: desarrollador-pro
nombre: Agente Desarrollador Pro (Qwen 3.5 4B, contexto largo)
descripcion: Asistente de desarrollo agéntico con el mayor contexto disponible para proyectos grandes.

# Qwen3.5 admite hasta 262144 tokens de contexto; este perfil limita el uso de memoria
# de la RX 6600 XT configurando 131072.
modelo: qwen3.5-4b-Q4_K_M

perfil_prompt: desarrollo

system_prompt: |
  En tareas amplias, lee por bloques pertinentes y resume lo aprendido; avisa si el contexto se
  aproxima al límite.

parametros:
  # Valores de Qwen3.5 para programación con razonamiento.
  temperature: 0.6
  top_p: 0.95
  # Incluye el razonamiento; tareas largas necesitan más margen.
  max_tokens: 16384
  forzar: false
  # Qwen3.5 piensa por defecto; 2048 limita cada bloque sin fijar max_tokens.
  reasoning_budget_tokens: 2048
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  repeat_penalty: 1.0

forzar_parametros: [reasoning_budget_tokens]

motor:
  # 131072 con caché q8_0 usa unos 2 GB de KV. El modelo admite 262144: súbelo si te sobra VRAM.
  ctx_size: 131072
  batch_size: 1024
  ubatch_size: 512
  gpu_layers: "auto"
  threads: 4
  extra_args: ["--threads-batch", "6", "--mmap", "--fit", "on", "--fit-target", "512"]
  parallel: 1
  cache_type_k: q8_0
  cache_type_v: q8_0
  flash_attn: "on"
  ngram_mod: false
